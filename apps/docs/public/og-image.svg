<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Canon dark canvas, full bleed. A social preview gets cropped and rounded
       differently by every platform, so a card inside a card only ever loses. -->
  <rect width="1200" height="630" fill="#12100d"/>

  <!-- The atmosphere, flattened to a still. The living mesh belongs on the page;
       an image only needs its warmth. -->
  <defs>
    <radialGradient id="warm1" cx="18%" cy="8%" r="62%">
      <stop offset="0%" stop-color="#F26A45" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F26A45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm2" cx="88%" cy="86%" r="54%">
      <stop offset="0%" stop-color="#E0A33C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#E0A33C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#warm1)"/>
  <rect width="1200" height="630" fill="url(#warm2)"/>

  <!-- mark and wordmark, the tiled container the brand reserves for chrome -->
  <g transform="translate(88, 74)">
    <rect width="48" height="48" rx="13" fill="#F26A45"/>
    <rect x="14" y="14" width="20" height="20" rx="4.8" fill="#FFFFFF" opacity="0.32"/>
    <rect x="22.5" y="22.5" width="11.5" height="11.5" rx="3.2" fill="#FFFFFF"/>
    <text x="66" y="34" font-family="Bricolage Grotesque" font-size="30" font-weight="800"
          letter-spacing="-0.6" fill="#F6F1E8">QUESTPIE</text>
  </g>

  <!-- the claim -->
  <text x="88" y="300" font-family="Bricolage Grotesque" font-size="104" font-weight="800"
        letter-spacing="-3.6" fill="#F6F1E8">Software you</text>
  <text x="88" y="404" font-family="Bricolage Grotesque" font-size="104" font-weight="800"
        letter-spacing="-3.6" fill="#F6F1E8">can staff.</text>

  <!-- What that means, in a person’s words. Bricolage rather than Hanken: this
       card is rasterised offline and the machine has no Hanken, so naming it would
       silently ship a system fallback. Same family as the display, one weight down. -->
  <text x="88" y="470" font-family="Bricolage Grotesque" font-size="26" font-weight="500"
        fill="#B6AC9C">An agent joins the way a person does — role, permissions, its own</text>
  <text x="88" y="506" font-family="Bricolage Grotesque" font-size="26" font-weight="500"
        fill="#B6AC9C">name on the work.</text>

  <!-- the proof strip: checkable facts or nothing -->
  <text x="88" y="576" font-family="JetBrains Mono" font-size="19" font-weight="500"
        letter-spacing="1.4" fill="#867D6F">MIT · TYPESCRIPT · POSTGRES · SELF-HOSTED</text>
</svg>
