name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    environment: npm
    runs-on: [self-hosted, linux, x64, questpie-release]
    timeout-minutes: 120
    # Ordinary quality must not discover a self-hosted runner's external DB.
    # Only the workload step receives the private service connection below.
    env:
      PGHOST: ""
      PGPORT: ""
      PGDATABASE: ""
      PGUSER: ""
      PGPASSWORD: ""
      DATABASE_URL: ""
      SQL_DATABASE_URL: ""
      PG_HOST: ""
      PG_PORT: ""
      PG_DATABASE: ""
      PG_USER: ""
      PG_PASSWORD: ""
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: questpie_release
          POSTGRES_USER: questpie_release
          POSTGRES_HOST_AUTH_METHOD: trust
          PGDATA: /var/lib/postgresql/questpie-release
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
        ports:
          - "127.0.0.1::5432"
        # Data stays in the disposable container's disk layer. Cover the image's
        # unused VOLUME so Actions teardown leaves no anonymous data volume.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U questpie_release -d questpie_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: bun ci
      - name: Verify triggering commit before validation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
      - run: bun run quality:release
      - name: Execute unchanged release workload matrix
        id: workloads
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGDATABASE: questpie_release
          PGUSER: questpie_release
          QUESTPIE_POSTGRES_MAJOR: "17"
          QUESTPIE_PERFORMANCE_EVIDENCE_CLASS: release-stable-runner-postgres17
        run: |
          set -euo pipefail
          logs=$(mktemp -d "${RUNNER_TEMP}/questpie-release-workloads.XXXXXX")
          printf 'logs=%s\n' "$logs" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$logs/identity.txt"
          [[ "$PGPORT" =~ ^[0-9]+$ ]]
          (( PGPORT > 0 && PGPORT <= 65535 ))
          unset DATABASE_URL SQL_DATABASE_URL PG_DATABASE PG_HOST PG_PORT PG_USER PG_PASSWORD PGPASSWORD PGSERVICE PGSERVICEFILE PGPASSFILE PGOPTIONS
          bun -e 'const db = new Bun.SQL({ max: 1 }); try { const [row] = await db`SELECT current_database() AS name, current_setting(${"server_version_num"})::integer / 10000 AS major`; if (row.name !== "questpie_release" || row.major !== 17) throw new Error("Release database identity mismatch"); } finally { await db.close(); }'
          bun run test:load -- --scenario beta08-worker-contention 2>&1 | tee "$logs/beta08-worker-contention.log"
          bun run test:load -- --scenario beta10-ten-instance 2>&1 | tee "$logs/beta10-ten-instance.log"
          bun run test:load -- --scenario pb05-mutation-transaction-tail 2>&1 | tee "$logs/pb05-mutation-transaction-tail.log"
          bun run test:soak -- --scenario beta10-soak-chaos 2>&1 | tee "$logs/beta10-soak-chaos.log"
          bun run bench:micro -- --scenario beta12-release-gate 2>&1 | tee "$logs/beta12-release-gate.log"
      - name: Retain workload evidence, including failures
        if: ${{ always() && steps.workloads.outputs.logs != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-workloads-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workloads.outputs.logs }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove only this attempt's uploaded workload logs
        id: cleanup-workload-logs
        if: ${{ always() && steps.workloads.outputs.logs != '' }}
        env:
          WORKLOAD_LOGS: ${{ steps.workloads.outputs.logs }}
        run: |
          bun -e '
            import { realpathSync, rmSync } from "node:fs";
            import { basename, dirname } from "node:path";
            const target = process.env.WORKLOAD_LOGS;
            const temporary = process.env.RUNNER_TEMP;
            if (!target || !temporary || dirname(target) !== realpathSync(temporary) ||
                !/^questpie-release-workloads\.[A-Za-z0-9]{6}$/.test(basename(target)) ||
                realpathSync(target) !== target) throw new Error("Invalid workload log cleanup target");
            rmSync(target, { recursive: true });
          '
      - name: Verify unchanged commit before publication
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
      - name: Publish from the exact verified tree
        if: ${{ success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: bun run release
        env:
          NPM_CONFIG_PROVENANCE: "true"
