name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    environment: npm
    runs-on: [self-hosted, linux, x64, questpie-release]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: bun ci
      - run: bun run quality:release
      - name: Publish from the exact verified tree
        run: bun run release
        env:
          NPM_CONFIG_PROVENANCE: "true"
