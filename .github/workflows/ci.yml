  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # `bun install` (not --frozen-lockfile) is intentional: bun 1.3.13's
      # frozen-lockfile check has a long-standing false-positive bug in this
      # monorepo (the lockfile is bit-identical after a fresh install but
      # frozen still reports "lockfile had changes"). The audit gate works
      # against the resolved tree either way — anything new that resolves
      # in is exactly what we'd want to catch.
      - name: Install dependencies
        run: bun install

      - name: Block new high/critical advisories
        run: bun run scripts/audit-gate.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bunx turbo run test --filter='./packages/*' --concurrency=1
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bunx turbo run build --filter='./packages/*'

      - name: Dist types gate
        run: bun run scripts/check-dist-types.ts

      # Deterministic tsc metrics (Types/Instantiations) vs committed budget —
      # fails on >10% instantiation regression. Re-baseline with --update.
      - name: Type budget gate
        run: bun run scripts/type-budget.ts

      # Per-package type-escape counts (": any", "as any", ...) must never
      # increase. Re-baseline with --update when counts go down.
      - name: any-census ratchet
        run: bun run scripts/any-census.ts

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate docs
        run: bun run validate:docs -- --docs-app
