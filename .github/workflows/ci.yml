name: CI

on:
  pull_request:
    branches: [main, feat/v4]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance-record:
    name: Acceptance record integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun run review:accept:verify -- --record docs/v4/implementation/beta08/REVIEW-04.json

  full:
    name: Cached full quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-
      - run: bun ci
      - run: bun run quality:full

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} correctness
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: questpie
          POSTGRES_USER: questpie
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U questpie -d questpie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun ci
      - run: bun run test:postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: questpie
          PGUSER: questpie
          QUESTPIE_POSTGRES_MAJOR: "${{ matrix.postgres }}"

  pgbouncer:
    name: PostgreSQL 17 transaction-pool topology
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: questpie
          POSTGRES_USER: questpie
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U questpie -d questpie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pgbouncer:
        image: edoburu/pgbouncer:v1.24.1-p0
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_NAME: questpie
          DB_USER: questpie
          AUTH_TYPE: trust
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: "2"
          MAX_CLIENT_CONN: "20"
        ports:
          - 6432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U questpie -d questpie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun ci
      - run: bun test tests/integration/postgres/beta12-postgres-module.test.ts
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: questpie
          PGUSER: questpie
          PGBOUNCER_PORT: "6432"

  typescript-forward:
    name: TypeScript 7 forward conformance
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun ci
      - run: bun run quality:typescript-forward

  micro:
    name: Selected-PR PostgreSQL and quick microbenchmarks
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'performance')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: questpie
          POSTGRES_USER: questpie
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U questpie -d questpie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun ci
      - run: bun run bench:micro
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: questpie
          PGUSER: questpie
          QUESTPIE_POSTGRES_MAJOR: "17"
          QUESTPIE_PERFORMANCE_EVIDENCE_CLASS: selected-pr-github-hosted-postgres17
