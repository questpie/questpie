name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gates ERRORS only. ~25s over 1994 files.
      #
      # WARNINGS ARE DELIBERATELY NOT GATED YET: there are 1454 of them, and
      # failing on that today would just mean disabling this job again — which
      # is exactly how the 85 errors accumulated while the job sat commented
      # out behind "TODO: Enable when lint errors are fixed". The follow-up is a
      # `lint-census` ratchet in the shape of scripts/any-census.ts (freeze the
      # per-rule counts, fail on an increase, burn down over time). Until that
      # lands the warning count is unbounded — do not read this job's green as
      # "the lint backlog is under control".
      - name: Run Oxlint
        run: bun run lint

      # `--list-different` rather than `--check`: identical pass/fail signal,
      # measured at 1m04s vs 6m11s on this tree (`--check` additionally computes
      # and prints per-file statistics). Cost is dominated by large markdown,
      # not code — skills/questpie/references/type-inference.md alone was 17.2s
      # under `--check`.
      #
      # Full-repo on purpose, not scoped to changed files: a changed-file scope
      # silently misses drift introduced by a merge, and 65s does not justify
      # the extra machinery.
      - name: Check formatting
        run: bunx oxfmt --list-different

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gates EVERY package that declares a `check-types` script — no filter.
      # This includes the `questpie` full-app fixture, which compiles a real
      # composed AppContext and is the gate that was structurally BLIND to the
      # AppContext⇄config codegen cycle, so a re-leak of the cycle/`any` fails
      # here. The per-example cold-error truth is gated separately by the
      # `example-errors ratchet` in the `build` job below.
      #
      # This ran filtered to 3 of 14 packages until 2026-07-27, leaving admin,
      # mcp, sandbox, workflows, crdt-yjs, openapi, hono, next, elysia,
      # create-questpie and vite-plugin-iconify ungated. The unfiltered run was
      # already green when the filter was removed; the extra packages cost
      # ~3 min on top of the graph this job already pays for.
      - name: Run type check (all packages)
        run: bunx turbo run check-types

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # `bun install` (not --frozen-lockfile) is intentional: bun 1.3.13's
      # frozen-lockfile check has a long-standing false-positive bug in this
      # monorepo (the lockfile is bit-identical after a fresh install but
      # frozen still reports "lockfile had changes"). The audit gate works
      # against the resolved tree either way — anything new that resolves
      # in is exactly what we'd want to catch.
      - name: Install dependencies
        run: bun install

      - name: Block new high/critical advisories
        run: bun run scripts/audit-gate.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bunx turbo run test --filter='./packages/*' --concurrency=1
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"

  realtime-matrix:
    name: Realtime driver matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify realtime migration generation is idempotent
        run: bun run verify:realtime-migrations

      - name: Start Postgres, Redis, and Soketi
        run: docker compose -f packages/questpie/test/fixtures/soketi/compose.yml up -d --wait

      - name: Run PostgreSQL txid ordering acceptance
        working-directory: packages/questpie
        run: bun test test/integration/realtime-txid-postgres.test.ts
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"
          QUESTPIE_REALTIME_TXID_DATABASE_URL: postgresql://questpie:questpie@127.0.0.1:54329/questpie_realtime

      - name: Run physical-purge transaction and storage-lock contracts
        working-directory: packages/questpie
        run: bun test test/collection/transaction-locks-postgres.test.ts
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"
          QUESTPIE_TRANSACTION_LOCK_DATABASE_URL: postgresql://questpie:questpie@127.0.0.1:54329/questpie_realtime

      - name: Run realtime driver and security matrix
        working-directory: packages/questpie
        run: bun test test/ --test-name-pattern "matrix|storm|dos|channel"
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"
          QUESTPIE_REALTIME_DRIVER_INTEGRATION: "1"
          QUESTPIE_SOKETI_INTEGRATION: "1"
          QUESTPIE_REALTIME_POSTGRES_URL: postgresql://questpie:questpie@127.0.0.1:54329/questpie_realtime
          QUESTPIE_REALTIME_REDIS_URL: redis://127.0.0.1:6379

      - name: Dump realtime service logs
        if: failure()
        run: docker compose -f packages/questpie/test/fixtures/soketi/compose.yml logs --no-color

      - name: Stop realtime services
        if: always()
        run: docker compose -f packages/questpie/test/fixtures/soketi/compose.yml down -v

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bunx turbo run build --filter='./packages/*'

      - name: Dist syntax gate
        run: find packages/*/dist -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Dist types gate
        run: bun run scripts/check-dist-types.ts

      # What npm would actually publish (`npm pack --dry-run`, so `files` and
      # .npmignore are honoured) vs the committed budget. Fails on >5% growth
      # in any package's unpacked size — tighter than the type budget's 10%,
      # because build output is near-deterministic for a fixed toolchain, so a
      # jump is a real change in what ships rather than measurement noise.
      # Re-baseline with --update. Must run after the build above.
      - name: Package size budget
        run: bun run scripts/size-budget.ts

      # What a BROWSER downloads, which is a different number from the one
      # above and catches the wins that one misses: moving CRDT off the default
      # client path cut 189 KB from every bundle while the published package got
      # slightly bigger. Measured with esbuild --splitting (what Vite/Rollup/
      # webpack do) and scored on the ENTRY chunk only — without splitting,
      # esbuild inlines dynamic imports and a correctly lazy dependency looks
      # like part of the entry. Fails on >3% growth.
      - name: Consumer bundle budget
        run: bun run scripts/bundle-budget.ts

      # Deterministic tsc metrics (Types/Instantiations) vs committed budget —
      # fails on >10% instantiation regression. Re-baseline with --update.
      - name: Type budget gate
        run: bun run scripts/type-budget.ts

      # Per-package type-escape counts (": any", "as any", ...) must never
      # increase. Re-baseline with --update when counts go down.
      - name: any-census ratchet
        run: bun run scripts/any-census.ts

      # Cold full-app tsc error counts per example must never increase. The
      # package gate is structurally blind to the codegen AppContext⇄config
      # cycle; the examples are the truth. Re-baseline with --update on a drop.
      - name: example-errors ratchet
        run: bun run scripts/example-errors.ts

      # ENFORCE the one-way codegen layer DAG (index → context.gen →
      # entities.gen → names.gen): every generated `.generated/` must import
      # DOWNWARD only, with no cycle. This locks in (BY CONSTRUCTION) the
      # impossibility of the AppContext⇄config / ctx→user-code cycles — a
      # regression in the codegen's emitted import directions fails here.
      - name: codegen layer DAG (no upward import / no cycle)
        run: bun run scripts/check-codegen-layers.ts

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate docs
        run: bun run validate:docs -- --docs-app

      - name: Verify canonical skill install parity
        run: bun run verify:skills-install
