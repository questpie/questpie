name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # NOT --frozen-lockfile. bun 1.3.13 rejects a lockfile it wrote itself
      # moments earlier: delete bun.lock, `bun install`, then
      # `bun install --frozen-lockfile` and it still reports "lockfile had
      # changes". Its comparator disagrees with its own writer, so the flag is
      # unusable here and the audit job has been working around it for months.
      #
      # `git diff --exit-code` gives the protection frozen was there for, and
      # gives it more honestly: it fails when installing actually CHANGES the
      # committed lockfile. That only works because the lockfile is now
      # deterministic — `typescript` is pinned to one exact version across the
      # workspace, and the caret range that used to sit in @questpie/admin made
      # consecutive installs disagree about a nested typescript@5.9.3.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      # Gates ERRORS only. ~25s over 1994 files. Warnings are held by the
      # lint-census ratchet in the next step rather than failed on here —
      # failing on 1443 at once would just mean disabling this job again, which
      # is exactly how the 85 errors accumulated while it sat commented out
      # behind "TODO: Enable when lint errors are fixed".
      - name: Run Oxlint
        run: bun run lint

      # Per-package, per-rule WARNING counts; any increase fails. This is the
      # follow-up the comment above used to promise.
      #
      # no-underscore-dangle is counted but NOT ratcheted: 1114 of the 1443
      # warnings are that rule, and a leading underscore is this codebase's
      # convention for internal members (_state, _pendingRelations). Gating it
      # would fail CI for following the house style. 329 warnings remain
      # governed. See the script header before adding to IGNORED_RULES.
      - name: lint-census ratchet
        run: bun run scripts/lint-census.ts

      # Imports of @deprecated symbols from the framework's own source. A rising
      # number means the tag is undeliverable — the deprecated code can never be
      # removed, and a user following its advice lands on a path the framework
      # does not itself use. 166 today (admin 125, questpie 41), dominated by
      # admin importing its own compat barrel and modules/core/routes using
      # createCollectionRoutes. Tests are excluded; exercising a deprecated path
      # is what a compatibility test is for.
      - name: deprecated-imports ratchet
        run: bun run scripts/deprecated-imports.ts

      # Functions copy-pasted rather than shared: same name AND byte-identical
      # body in 2+ files, counted as redundant copies (N files contribute N-1).
      # Name alone would be noise — handleClick appears in six admin components.
      # This is the copy-then-drift defect that produced interpolate x6 in two
      # behaviours and toPascalCase x4 in three algorithms. It also finds
      # equalBytes existing as three different implementations in the CRDT
      # layer, only one of which is constant-time.
      - name: clone-census ratchet
        run: bun run scripts/clone-census.ts

      # `--list-different` rather than `--check`: identical pass/fail signal,
      # measured at 1m04s vs 6m11s on this tree (`--check` additionally computes
      # and prints per-file statistics). Cost is dominated by large markdown,
      # not code — skills/questpie/references/type-inference.md alone was 17.2s
      # under `--check`.
      #
      # Full-repo on purpose, not scoped to changed files: a changed-file scope
      # silently misses drift introduced by a merge, and 65s does not justify
      # the extra machinery.
      - name: Check formatting
        run: bunx oxfmt --list-different

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      # Gates EVERY package that declares a `check-types` script — no filter.
      # This includes the `questpie` full-app fixture, which compiles a real
      # composed AppContext and is the gate that was structurally BLIND to the
      # AppContext⇄config codegen cycle, so a re-leak of the cycle/`any` fails
      # here. The per-example cold-error truth is gated separately by the
      # `example-errors ratchet` in the `build` job below.
      #
      # turbo.json cannot carry comments, so the two facts behind this step live
      # here. `check-types` depends on `^build`, NOT `^check-types`: what a
      # dependent package needs is its dependencies' EMITTED .d.ts, and
      # `^check-types` only proves they typechecked their own sources — it emits
      # nothing. It was `^check-types` until 2026-07-29 and passed on every
      # developer machine purely because dist/ was already lying around from an
      # earlier build; the first CI run on a clean checkout failed with TS2307
      # "Cannot find module '@questpie/vite-plugin-iconify'". Relatedly, `build`
      # now declares `dist/**` in outputs — without it turbo logged "no output
      # files found" on every task and could not cache or restore a build.
      #
      # This ran filtered to 3 of 14 packages until 2026-07-27, leaving admin,
      # mcp, sandbox, workflows, crdt-yjs, openapi, hono, next, elysia,
      # create-questpie and vite-plugin-iconify ungated. The unfiltered run was
      # already green when the filter was removed; the extra packages cost
      # ~3 min on top of the graph this job already pays for.
      - name: Run type check (all packages)
        run: bunx turbo run check-types

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Block new high/critical advisories
        run: bun run scripts/audit-gate.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Run tests
        run: bunx turbo run test --filter='./packages/*' --concurrency=1 --ui=stream --log-order=stream
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"

  realtime-matrix:
    name: Realtime driver matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Verify realtime migration generation is idempotent
        run: bun run verify:realtime-migrations

      - name: Start Postgres, Redis, and Soketi
        run: docker compose -f packages/questpie/test/fixtures/soketi/compose.yml up -d --wait

      - name: Run PostgreSQL txid ordering acceptance
        working-directory: packages/questpie
        run: bun test test/integration/realtime-txid-postgres.test.ts
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"
          QUESTPIE_REALTIME_TXID_DATABASE_URL: postgresql://questpie:questpie@127.0.0.1:54329/questpie_realtime

      - name: Run physical-purge transaction and storage-lock contracts
        working-directory: packages/questpie
        run: bun test test/collection/transaction-locks-postgres.test.ts
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"
          QUESTPIE_TRANSACTION_LOCK_DATABASE_URL: postgresql://questpie:questpie@127.0.0.1:54329/questpie_realtime

      - name: Run realtime driver and security matrix
        working-directory: packages/questpie
        run: bun test test/ --test-name-pattern "matrix|storm|dos|channel"
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"
          QUESTPIE_REALTIME_DRIVER_INTEGRATION: "1"
          QUESTPIE_SOKETI_INTEGRATION: "1"
          QUESTPIE_REALTIME_POSTGRES_URL: postgresql://questpie:questpie@127.0.0.1:54329/questpie_realtime
          QUESTPIE_REALTIME_REDIS_URL: redis://127.0.0.1:6379

      - name: Dump realtime service logs
        if: failure()
        run: docker compose -f packages/questpie/test/fixtures/soketi/compose.yml logs --no-color

      - name: Stop realtime services
        if: always()
        run: docker compose -f packages/questpie/test/fixtures/soketi/compose.yml down -v

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Build packages
        run: bunx turbo run build --filter='./packages/*'

      - name: Dist syntax gate
        run: find packages/*/dist -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Dist types gate
        run: bun run scripts/check-dist-types.ts

      # What npm would actually publish (`npm pack --dry-run`, so `files` and
      # .npmignore are honoured) vs the committed budget. Fails on >5% AND
      # >1 KB growth in any package's unpacked size — both conditions, because a
      # bare percentage is unusable on the 6 KB and 9 KB packages where one
      # JSDoc block clears 5%. Build output is near-deterministic for a fixed
      # toolchain, so a jump clearing both is a real change in what ships.
      # Re-baseline with --update. Must run after the build above.
      - name: Package size budget
        run: bun run scripts/size-budget.ts

      # What a BROWSER downloads, which is a different number from the one
      # above and catches the wins that one misses: moving CRDT off the default
      # client path cut 189 KB from every bundle while the published package got
      # slightly bigger. Measured with esbuild --splitting (what Vite/Rollup/
      # webpack do) and scored on the ENTRY chunk only — without splitting,
      # esbuild inlines dynamic imports and a correctly lazy dependency looks
      # like part of the entry. Fails on >3% growth.
      - name: Consumer bundle budget
        run: bun run scripts/bundle-budget.ts

      # Deterministic tsc metrics (Types/Instantiations) vs committed budget —
      # fails on >3% instantiation regression. Re-baseline with --update.
      - name: Type budget gate
        run: bun run scripts/type-budget.ts

      # Per-package type-escape counts (": any", "as any", ...) must never
      # increase. Re-baseline with --update when counts go down.
      - name: any-census ratchet
        run: bun run scripts/any-census.ts

      # Source files nothing can reach from a package's declared exports, its
      # .generated output or its bin. Reachability, not "who imports me" — and
      # it refuses to answer at all if too many specifiers fail to resolve,
      # since an unresolved import can only make files look deader than they
      # are. Run with --list to see them.
      - name: dead-modules ratchet
        run: bun run scripts/dead-modules.ts

      # Cold full-app tsc error counts per example must never increase. The
      # package gate is structurally blind to the codegen AppContext⇄config
      # cycle; the examples are the truth. Re-baseline with --update on a drop.
      - name: example-errors ratchet
        run: bun run scripts/example-errors.ts

      # Committed `.generated/**` must equal what codegen emits TODAY. This was
      # blind until 2026-07-29: toy-factory-backend's output was last committed
      # before #167 and no longer typechecked when regenerated, so the
      # example-errors ratchet above was certifying a frozen artifact codegen had
      # stopped producing.
      #
      # The second run needs `--force`. Without it turbo sees unchanged inputs,
      # restores `**/.generated/**` from cache and reports FULL TURBO — which
      # proves the cache works and says nothing about the generator. `--force`
      # makes it a real second generation, so a no-op diff means deterministic.
      - name: Codegen freshness (committed output matches a fresh generation)
        run: |
          bunx turbo run questpie:generate
          git diff --exit-code
          bunx turbo run questpie:generate --force
          git diff --exit-code

      # ENFORCE the one-way codegen layer DAG (index → context.gen →
      # entities.gen → names.gen): every generated `.generated/` must import
      # DOWNWARD only, with no cycle. This locks in (BY CONSTRUCTION) the
      # impossibility of the AppContext⇄config / ctx→user-code cycles — a
      # regression in the codegen's emitted import directions fails here.
      - name: codegen layer DAG (no upward import / no cycle)
        run: bun run scripts/check-codegen-layers.ts

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Validate docs
        run: bun run validate:docs -- --docs-app

      - name: Verify canonical skill install parity
        run: bun run verify:skills-install

      # AGENTS.md is generated from SKILL.md + references/. Editing a reference
      # without regenerating leaves the file agents actually read out of date,
      # and nothing else in CI notices.
      - name: Verify generated skill docs are current
        run: bun run scripts/build-skill-docs.ts --check

      # Every public value export must be mentioned in the skill or classified
      # in skills/questpie/coverage.json. Catches shipping API that the
      # AI-facing docs never learned about.
      - name: Verify skill coverage of the public API
        run: bun run scripts/skill-coverage.ts --strict
