name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # NOT --frozen-lockfile. bun 1.3.13 rejects a lockfile it wrote itself
      # moments earlier: delete bun.lock, `bun install`, then
      # `bun install --frozen-lockfile` and it still reports "lockfile had
      # changes". Its comparator disagrees with its own writer, so the flag is
      # unusable here and the audit job has been working around it for months.
      #
      # `git diff --exit-code` gives the protection frozen was there for, and
      # gives it more honestly: it fails when installing actually CHANGES the
      # committed lockfile. That only works because the lockfile is now
      # deterministic — `typescript` is pinned to one exact version across the
      # workspace, and the caret range that used to sit in @questpie/admin made
      # consecutive installs disagree about a nested typescript@5.9.3.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      # The same stage is available locally through `bun run verify:pr`.
      - name: Run lint and formatting contract
        run: bun run verify:pr -- --stage lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      # Gates EVERY package that declares a `check-types` script — no filter.
      # This includes the `questpie` full-app fixture, which compiles a real
      # composed AppContext and is the gate that was structurally BLIND to the
      # AppContext⇄config codegen cycle, so a re-leak of the cycle/`any` fails
      # here. The per-example cold-error truth is gated separately by the
      # `example-errors ratchet` in the `build` job below.
      #
      # turbo.json cannot carry comments, so the two facts behind this step live
      # here. `check-types` depends on `^build`, NOT `^check-types`: what a
      # dependent package needs is its dependencies' EMITTED .d.ts, and
      # `^check-types` only proves they typechecked their own sources — it emits
      # nothing. It was `^check-types` until 2026-07-29 and passed on every
      # developer machine purely because dist/ was already lying around from an
      # earlier build; the first CI run on a clean checkout failed with TS2307
      # "Cannot find module '@questpie/vite-plugin-iconify'". Relatedly, `build`
      # now declares `dist/**` in outputs — without it turbo logged "no output
      # files found" on every task and could not cache or restore a build.
      #
      # This ran filtered to 3 of 14 packages until 2026-07-27, leaving admin,
      # mcp, sandbox, workflows, crdt-yjs, openapi, hono, next, elysia,
      # create-questpie and vite-plugin-iconify ungated. The unfiltered run was
      # already green when the filter was removed; the extra packages cost
      # ~3 min on top of the graph this job already pays for.
      - name: Run type check (all packages)
        run: bun run verify:pr -- --stage typecheck

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Block new high/critical advisories
        run: bun run verify:pr -- --stage audit

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Run tests
        run: bun run verify:pr -- --stage test

  realtime-matrix:
    name: Realtime driver matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Verify realtime migration generation is idempotent
        run: bun run verify:realtime-migrations

      - name: Start Postgres, Redis, and Soketi
        run: docker compose -f packages/questpie/test/fixtures/soketi/compose.yml up -d --wait

      - name: Run PostgreSQL txid ordering acceptance
        working-directory: packages/questpie
        run: |
          bun test test/integration/realtime-txid-postgres.test.ts
          bun test test/integration/realtime-drain-cursor-postgres.test.ts
          bun test test/integration/ordered-channel-ledger-postgres.test.ts
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"
          QUESTPIE_REALTIME_TXID_DATABASE_URL: postgresql://questpie:questpie@127.0.0.1:54329/questpie_realtime
          QUESTPIE_CHANNEL_LEDGER_DATABASE_URL: postgresql://questpie:questpie@127.0.0.1:54329/questpie_realtime

      - name: Run physical-purge transaction and storage-lock contracts
        working-directory: packages/questpie
        run: bun test test/collection/transaction-locks-postgres.test.ts
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"
          QUESTPIE_TRANSACTION_LOCK_DATABASE_URL: postgresql://questpie:questpie@127.0.0.1:54329/questpie_realtime

      - name: Run realtime driver and security matrix
        working-directory: packages/questpie
        run: bun test test/ --test-name-pattern "matrix|storm|dos|channel"
        env:
          QUESTPIE_MIGRATIONS_SILENT: "1"
          QUESTPIE_REALTIME_DRIVER_INTEGRATION: "1"
          QUESTPIE_SOKETI_INTEGRATION: "1"
          QUESTPIE_REALTIME_POSTGRES_URL: postgresql://questpie:questpie@127.0.0.1:54329/questpie_realtime
          QUESTPIE_REALTIME_REDIS_URL: redis://127.0.0.1:6379

      - name: Dump realtime service logs
        if: failure()
        run: docker compose -f packages/questpie/test/fixtures/soketi/compose.yml logs --no-color

      - name: Stop realtime services
        if: always()
        run: docker compose -f packages/questpie/test/fixtures/soketi/compose.yml down -v

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Run build, dist, budget, ratchet, and codegen contract
        run: bun run verify:pr -- --stage build

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # See the Lint & Format job for why this is not --frozen-lockfile.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Run docs and skill contract
        run: bun run verify:pr -- --stage docs
