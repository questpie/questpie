name: Documentation problem
description: The v4 specification or documentation is incorrect or inconsistent
labels: ["bug", "documentation"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State the conflicting or incorrect claim and its location.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link the relevant specification, ADR, research, or primary source.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues
          required: true
