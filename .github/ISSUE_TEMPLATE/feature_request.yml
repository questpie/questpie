name: Product design proposal
description: Propose a v4 product guarantee or change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the application problem and the guarantee that is missing.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: Show current workarounds, competing designs, and the smallest useful scope.
    validations:
      required: true

  - type: textarea
    id: tracer
    attributes:
      label: Tracer proof
      description: Explain how one end-to-end application slice can prove or reject the proposal.
    validations:
      required: true
