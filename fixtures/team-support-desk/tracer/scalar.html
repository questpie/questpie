<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Team Support Desk API</title>
	</head>
	<body>
		<div id="app"></div>
		<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.67.0"></script>
		<script type="module">
			import { createScalarConfiguration } from "/scalar-configuration.js";

			void (async () => {
				const document = await fetch("/openapi.json").then((response) =>
					response.json(),
				);
				Scalar.createApiReference("#app", createScalarConfiguration(document));
			})();
		</script>
	</body>
</html>
