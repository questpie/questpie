<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Team Support Desk API</title>
	</head>
	<body>
		<div id="app"></div>
		<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.67.0"></script>
		<script>
			void (async () => {
				const document = await fetch("/openapi.json").then((response) =>
					response.json(),
				);
				const compatibilityHeaders = [
					"Questpie-Application",
					"Questpie-Client-Contract",
					"Questpie-Wire-Digest",
				];
				Scalar.createApiReference("#app", {
					content: document,
					onBeforeRequest: ({ requestBuilder }) => {
						for (const name of compatibilityHeaders) {
							const value = document.components.parameters[name].schema.default;
							requestBuilder.headers.set(name, value);
						}
					},
				});
			})();
		</script>
	</body>
</html>
